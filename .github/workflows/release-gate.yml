name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: none

jobs:
  release-gate:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"

    steps:
      - name: "TDS identity: 24f2008956@ds.study.iitm.ac.in"
        run: echo "TDS identity: 24f2008956@ds.study.iitm.ac.in"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Start API
        run: python -m uvicorn main:app --host 127.0.0.1 --port 8000 &

      - name: Wait for API
        run: sleep 5

      - name: Test release gate
        run: >
          python -c "import json,urllib.request; p={'target':'preview','event':'push','ref':'refs/heads/main','workflow':{'trigger':'push','permissions':{'contents':'read','packages':'write','id-token':'none'},'testsPassed':True,'matrixComplete':True,'failFast':False,'actions':[{'owner':'actions','name':'checkout','ref':'v4'}]},'image':{'multiStage':True,'runsAsRoot':False,'secretMode':'none','criticalVulnerabilities':0,'digestPinned':True}}; r=urllib.request.Request('http://127.0.0.1:8000/release-gate',data=json.dumps(p).encode(),headers={'Content-Type':'application/json'},method='POST'); x=json.load(urllib.request.urlopen(r)); print(x); assert x['decision']=='promote' and x['violations']==[]"